<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 신청 — DIPO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0d1117 0%, #0f1923 60%, #0a1520 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif; color: #e2e8f0; padding: 20px;
        }
        .card {
            background: #161b27; border: 1px solid #232d42;
            border-radius: 12px; padding: 36px; width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo { font-size: 18px; font-weight: 800; color: #7dd3fc; margin-bottom: 4px; }
        .logo span { color: #f90; }
        h2 { font-size: 16px; color: #c2d8f0; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #5a7a99; margin-bottom: 24px; line-height: 1.5; }
        label {
            font-size: 12px; color: #5a7a99; display: block;
            margin-bottom: 5px; margin-top: 14px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        input[type="text"], input[type="email"],
        input[type="password"], select, textarea {
            width: 100%; padding: 10px 12px;
            background: #0e1520; border: 1px solid #2a3550;
            border-radius: 6px; color: #e2e8f0; font-size: 14px;
            font-family: inherit; outline: none; transition: border-color .15s;
        }
        input:focus, select:focus, textarea:focus { border-color: #0073bb; }
        textarea { resize: vertical; min-height: 80px; }
        .role-hint {
            font-size: 11px; color: #4a5568; margin-top: 4px; line-height: 1.5;
        }
        #reasonGroup { display: none; margin-top: 0; }
        button[type="submit"] {
            width: 100%; padding: 11px; margin-top: 20px;
            background: #0073bb; color: #fff; border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background .15s;
        }
        button[type="submit"]:hover { background: #005a96; }
        .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
        .alert-danger  { background: #1a0000; border: 1px solid #7f1d1d; color: #f87171; }
        .login-link {
            text-align: center; margin-top: 16px; font-size: 13px; color: #5a7a99;
        }
        .login-link a { color: #7dd3fc; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">Infra<span>Pilot</span></div>
    <h2>계정 신청</h2>
    <p class="subtitle">가입 신청 후 관리자 승인이 완료되면 로그인이 가능합니다.</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>사용자명 *</label>
        <input type="text" name="username" placeholder="예: john.doe" required autofocus>

        <label>이메일</label>
        <input type="email" name="email" placeholder="선택사항">

        <label>비밀번호 *</label>
        <input type="password" name="password" placeholder="8자 이상" required>

        <label>비밀번호 확인 *</label>
        <input type="password" name="confirm_password" placeholder="비밀번호 재입력" required>

        <label>요청 역할 *</label>
        <select name="role" id="roleSelect" onchange="onRoleChange(this.value)">
            <option value="viewer" selected>Viewer — 조회만 가능 (기본)</option>
            <option value="operator">Operator — VM 프로비저닝, 볼륨 관리 가능</option>
            <option value="admin">Admin — 전체 접근</option>
        </select>
        <div class="role-hint">Viewer 외 역할 요청 시 사유를 입력해야 합니다.</div>

        <div id="reasonGroup">
            <label>요청 사유 *</label>
            <textarea name="reason" placeholder="해당 역할이 필요한 이유를 설명해주세요."></textarea>
        </div>

        <button type="submit">가입 신청</button>
    </form>

    <div class="login-link">
        이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a>
    </div>
</div>

<script>
function onRoleChange(val) {
    const g = document.getElementById('reasonGroup');
    const t = g.querySelector('textarea');
    if (val !== 'viewer') {
        g.style.display = 'block';
        t.required = true;
    } else {
        g.style.display = 'none';
        t.required = false;
        t.value = '';
    }
}
</script>
</body>
</html>
