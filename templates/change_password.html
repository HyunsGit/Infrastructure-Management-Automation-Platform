<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 — DIPO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #232946 0%, #1a2233 60%, #15334a 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif; color: #f3f6fa;
        }
        .card {
            background: rgba(27,32,46,0.97); border: 1px solid #2a3550;
            border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .logo { font-size: 22px; font-weight: 700; color: #7dd3fc; margin-bottom: 6px; }
        h2 { font-size: 17px; color: #c2d8f0; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #5a7a99; margin-bottom: 24px; line-height: 1.6; }
        .user-badge {
            background: #0e1520; border: 1px solid #2a3550; border-radius: 6px;
            padding: 6px 12px; font-size: 13px; color: #7dd3fc;
            font-family: 'Courier New', monospace; text-align: center; margin-bottom: 20px;
        }
        label { font-size: 13px; color: #5a7a99; display: block; margin-bottom: 6px; margin-top: 14px; }
        input[type="password"] {
            width: 100%; padding: 11px 14px; background: #0e1520;
            border: 1px solid #2a3550; border-radius: 8px; color: #f3f6fa;
            font-size: 15px; outline: none; transition: border-color .2s;
        }
        input[type="password"]:focus { border-color: #2196F3; }
        button {
            width: 100%; padding: 12px; background: #2196F3; color: #fff;
            border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 20px; transition: background .15s;
        }
        button:hover { background: #1976D2; }
        .alert-danger { background: #1a0000; border: 1px solid #7f1d1d; color: #f87171;
            padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; }
        .hint { font-size: 11px; color: #5a7a99; margin-top: 8px; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">DIPO</div>
    <h2>🔑 비밀번호 변경</h2>
    <p class="subtitle">임시 비밀번호로 로그인하셨습니다. 새 비밀번호를 설정해주세요.</p>

    {% if error %}
    <div class="alert-danger">{{ error }}</div>
    {% endif %}

    <div class="user-badge">{{ username }}</div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>새 비밀번호</label>
        <input type="password" name="new_password" required autofocus placeholder="8자 이상">
        <label>비밀번호 확인</label>
        <input type="password" name="confirm_password" required placeholder="비밀번호 재입력">
        <p class="hint">8자 이상, 기억하기 쉬운 안전한 비밀번호를 사용하세요.</p>
        <button type="submit">비밀번호 변경</button>
    </form>
</div>
</body>
</html>
